name: Build app packages

on:
  #push:
    #branches: [main, master]
    #tags: ['v*']
  #pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  PYTHONUTF8: '1'

jobs:
  # 检查不阻断出包；测试按 2026-09-21 约定暂停，结果仅供参考。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: duanjushijie
            arguments: ''
          - edition: quanjushijie
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Add sdkmanager to PATH
        run: |
          SDKM_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)")
          echo "$SDKM_BIN" >> "$GITHUB_PATH"
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: duanjushijie
            arguments: ''
          - edition: quanjushijie
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install MinGW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $prefix = $null
          # 主线：choco 锁定 13.2.0。社区 feed 已升级 mingw 到 16.x，
          # 对下架的 13.2.0 会返回 406 / package not found，失败不中断，走兜底。
          choco install mingw --version=13.2.0 -y --no-progress
          if (Test-Path 'C:\ProgramData\mingw64\mingw64\bin\x86_64-w64-mingw32-gcc.exe') {
            $prefix = 'C:\ProgramData\mingw64\mingw64'
          } else {
            # 兜底：从 winlibs 官方 GitHub Release 直取同版本 GCC 13.2.0
            # （POSIX 线程 / SEH / UCRT，与 choco mingw 13.2.0 同源配置），
            # Actions Windows runner 到 GitHub 直连稳定。
            $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/13.2.0posix-17.0.6-11.0.1-ucrt-r5/winlibs-x86_64-posix-seh-gcc-13.2.0-mingw-w64ucrt-11.0.1-r5.zip'
            $zip = Join-Path $env:RUNNER_TEMP 'winlibs-mingw.zip'
            $dst = 'C:\mingw-w64'
            for ($i = 1; $i -le 3; $i++) {
              try {
                $ProgressPreference = 'SilentlyContinue'
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600
                break
              } catch {
                Write-Host "winlibs 下载第 $i 次失败：$($_.Exception.Message)"
                if ($i -eq 3) { throw }
                Start-Sleep -Seconds 10
              }
            }
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
            if (Test-Path $sevenZip) {
              & $sevenZip x $zip "-o$dst" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw '7z 解压 mingw 失败' }
            } else {
              Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
            }
            Remove-Item $zip -ErrorAction SilentlyContinue
            if (Test-Path (Join-Path $dst 'mingw64\bin\x86_64-w64-mingw32-gcc.exe')) {
              $prefix = Join-Path $dst 'mingw64'
            }
          }
          if (-not $prefix) { throw '未找到可用的 MinGW-w64 13.2.0（choco 与 winlibs 兜底均失败）' }
          $bin = Join-Path $prefix 'bin'
          Add-Content $env:GITHUB_PATH $bin
          & (Join-Path $bin 'x86_64-w64-mingw32-gcc.exe') --version
          # 移除 winpthread 导入库，强制 cgo 静态链接，避免 DLL 依赖（原有处理）。
          $lib = Join-Path $prefix 'x86_64-w64-mingw32\lib'
          if (Test-Path $lib) {
            Remove-Item (Join-Path $lib 'libpthread.dll.a') -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $lib 'libwinpthread.dll.a') -ErrorAction SilentlyContinue
          }
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw 'Inno Setup compiler was not installed'
          }
          Split-Path -Parent $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - run: choco install ffmpeg --no-progress -y
      - name: Windows package smoke
        run: python scripts/smoke_windows.py ${{ matrix.arguments }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: duanjushijie
            arguments: ''
          - edition: quanjushijie
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_macos.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-macos
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  # 本地服务版：Go 服务器内置网页，浏览器打开 127.0.0.1:8000/web/ 或局域网地址即可使用。
  # 一次构建两个版本，产物为 duanjushijie.zip、quanjushijie.zip 与打包后的 guoappweb.zip。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - run: python scripts/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: guoappweb
          path: dist/web/guoappweb.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: duanjushijie
            arguments: ''
          - edition: quanjushijie
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
