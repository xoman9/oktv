name: Build Zhenguo missing channels ARM64

on:
  push:
    branches:
      - feature/zhenguo-missing-channels-20261021
      - fix/merge-single-unlimited-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Setup Android NDK
        run: |
          SDKM_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)")
          echo "$SDKM_BIN" >> "$GITHUB_PATH"
          yes | "$SDKM_BIN/sdkmanager" --licenses > /dev/null || true
          "$SDKM_BIN/sdkmanager" 'ndk;28.2.13676358'
      - name: Unit tests for migrated sources
        run: go test ./core -run 'Test(MiguoSourceRegistration|ZhenguoAddedMacCMSSources|ZhenguoYouguoLiuguoRegistration)' -count=1
        working-directory: native
      - name: Check single-episode merge tests
        run: flutter test test/media_library_test.dart --plain-name 'one complete episode is sufficient for merge codec planning'
      - name: Configure signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build all-sources ARM64 APK
        run: python scripts/build_android.py --all-sources --abi arm64-v8a
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v7
        with:
          name: quanjushijie-1.4.2m+94-arm64-v8a
          path: dist/android/quanjushijie-1.4.2m+94-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
